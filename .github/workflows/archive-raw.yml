name: Check storage policy (legacy raw archive disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_storage_policy.py
      - run: python3 scripts/assets.py validate
# Existing verified raw Release remains an independent backup.
# New datasets/models belong on HF; no automatic Release uploads.
